<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- SEO -->
    <meta name="description" content="WanderLux — AI-powered travel planning. Discover breathtaking destinations, get personalized day-by-day itineraries powered by Gemini AI, and explore the world with real-time weather and curated photography." />
    <meta name="keywords" content="travel planner, AI itinerary, destinations, weather, Gemini AI, travel app" />
    <meta name="author" content="WanderLux" />
    <meta name="theme-color" content="#0c0a08" />
    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->
    <meta property="og:title" content="WanderLux — Discover Your Next Adventure" />
    <meta property="og:description" content="AI-powered travel planning with live weather, curated destinations, and Gemini-generated itineraries." />
    <meta property="og:type" content="website" />

    <meta name="twitter:title" content="WanderLux — Discover Your Next Adventure" />
    <meta name="twitter:description" content="AI-powered travel planning with live weather, curated destinations, and personalized itineraries." />

    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="X-Frame-Options" content="SAMEORIGIN" />

    <!-- Favicon suite -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>WanderLux — Discover Your Next Adventure</title>
