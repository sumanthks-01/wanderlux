<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Background: warm obsidian rounded square -->
  <rect width="64" height="64" rx="14" fill="#0c0a08"/>

  <!-- Outer ring -->
  <circle cx="32" cy="32" r="22" stroke="#f59e00" stroke-width="1.5" stroke-opacity="0.4"/>
  <circle cx="32" cy="32" r="20" stroke="#f59e00" stroke-width="0.5" stroke-opacity="0.2"/>

  <!-- Compass rose — N/S points (longer, tapered diamonds) -->
  <!-- North point -->
  <polygon points="32,10 34.5,30 32,28 29.5,30" fill="#f59e00"/>
  <!-- South point -->
  <polygon points="32,54 34.5,34 32,36 29.5,34" fill="#c97c00"/>

  <!-- E/W points (shorter) -->
  <!-- East point -->
  <polygon points="54,32 34,29.5 36,32 34,34.5" fill="#f59e00"/>
  <!-- West point -->
  <polygon points="10,32 30,29.5 28,32 30,34.5" fill="#c97c00"/>

  <!-- Center dot -->
  <circle cx="32" cy="32" r="3" fill="#fcc84b"/>
  <circle cx="32" cy="32" r="1.5" fill="#0c0a08"/>

  <!-- Cardinal tick marks -->
  <line x1="32" y1="12" x2="32" y2="14" stroke="#f59e00" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="32" y1="50" x2="32" y2="52" stroke="#f59e00" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="12" y1="32" x2="14" y2="32" stroke="#f59e00" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
  <line x1="50" y1="32" x2="52" y2="32" stroke="#f59e00" stroke-width="1.5" stroke-linecap="round" stroke-opacity="0.6"/>
</svg>